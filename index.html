<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdownエディター かんたんmdくん for NKK</title>
    <!-- 外部ライブラリの読み込み -->
    <!-- marked.js のバージョンを 2.0.3 に設定 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/2.0.3/marked.min.js"></script>
    <!-- highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <!-- MathJaxの読み込み -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
    <!-- スタイルシートの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="app-header">
        <span class="app-title">Markdownエディター かんたんmdくん for NKK</span>
        <span id="app-version">Version 1.4.0</span>
    </header>

    <!-- エディタコンテナ -->
    <div id="editor-container">
        <!-- 上部の操作パネル -->
        <div id="editor-toolbar">
            <input type="text" id="filename" placeholder="ファイル名（拡張子不要）">
            <button id="loadBtn">ファイルを開く</button>
            <button id="downloadBtn">ダウンロード</button>
        </div>
        <!-- エディタとプレビューエリア -->
        <div id="editor-area">
            <section class="editor-pane editor-pane-input">
                <h2 class="pane-heading">
                    <span>マークダウン入力</span>
                    <span class="editor-heading-actions">
                        <label class="whitespace-toggle">
                            <input type="checkbox" id="showWhitespace" checked>
                            <span>空白を表示</span>
                        </label>
                        <button type="button" id="copyMarkdownBtn">コピー</button>
                        <button type="button" id="clearMarkdownBtn">クリア</button>
                    </span>
                </h2>
                <div id="editor-wrapper">
                    <div id="whitespace-overlay" aria-hidden="true"></div>
                <textarea id="editor" spellcheck="false"></textarea>
                </div>
            </section>
            <section class="editor-pane editor-pane-preview">
                <h2 class="pane-heading">
                    <span>プレビュー</span>
                    <label class="scroll-sync-toggle">
                        <input type="checkbox" id="syncScroll" checked>
                        <span>スクロール同期</span>
                    </label>
                </h2>
                <div id="preview"></div>
            </section>
        </div>
    </div>

    <!-- スクリプトの読み込み -->
    <footer id="app-footer">
        <span>© 2026 日本国際工科専門学校 IT教育部</span>
        <span>本ツールは、<a href="license.html" target="_blank" rel="noopener noreferrer">GNU GPL v3ライセンス</a>に基づき、phys_ken氏の「かんたんmdくん」を授業用に改変したものです。</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
